[project]
name = "insurance-platform"
version = "0.1.0"
description = "Insurance Geospatial Intelligence Platform"
readme = "README.md"
authors = [
    { name = "kalein.mondragon", email = "kalein.mondragon@octopy.com" }
]
requires-python = ">=3.12"
dependencies = [
    "geoalchemy2==0.21.0",
    "geopandas==1.2.0",
    "pandas==3.1.1",
    "psycopg2-binary==2.9.13",
    "requests==2.34.2",
    "sqlalchemy==2.1.9",
    "pyyaml==6.0.1",
    "colorlog==6.12.0",
    "fastapi==0.165.0",
    "uvicorn==0.30.6",
]

[project.optional-dependencies]
dev = [
    "pre-commit==3.8.0",
    "black==24.4.0",
    "ruff==0.4.4",
]

[project.scripts]
insurance-platform = "insurance_platform:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
